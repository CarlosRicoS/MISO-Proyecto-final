<th-popup
  [isOpen]="isAlertOpen"
  variant="error"
  [title]="alertTitle"
  [message]="alertMessage"
  [primaryButtonText]="'COMMON.ACCEPT' | translate"
  (primaryAction)="isAlertOpen = false"
></th-popup>

<ion-content [fullscreen]="true" class="login-content">
  <ion-grid class="login-shell">
    <ion-row class="login-row">
      <ion-col
        size="12"
        size-sm="10"
        size-md="8"
        size-lg="5"
        size-xl="4"
        class="login-col"
      >
        <ion-card class="login-card">
          <ion-card-content class="login-card__content">
            <div class="login-card__header">
              <h1 class="login-card__title">{{ 'LOGIN.TITLE' | translate }}</h1>
              <p class="login-card__subtitle">
                {{ 'LOGIN.SUBTITLE' | translate }}
              </p>
            </div>

            <div class="login-card__fields">
              <th-input
                [label]="'LOGIN.EMAIL_LABEL' | translate"
                [placeholder]="'LOGIN.EMAIL_PLACEHOLDER' | translate"
                type="email"
                startIcon="mail-outline"
                [value]="email"
                [state]="emailState"
                [helper]="emailHelper"
                (valueChange)="onEmailChange($event)"
                (enterPress)="onSignIn()"
              ></th-input>
              <th-input
                [label]="'LOGIN.PASSWORD_LABEL' | translate"
                [placeholder]="'LOGIN.PASSWORD_PLACEHOLDER' | translate"
                [type]="passwordInputType"
                startIcon="lock-closed-outline"
                [endIcon]="passwordTrailIcon"
                [endIconAriaLabel]="(isPasswordVisible ? 'LOGIN.HIDE_PASSWORD' : 'LOGIN.SHOW_PASSWORD') | translate"
                [value]="password"
                [state]="passwordState"
                [helper]="passwordHelper"
                (valueChange)="onPasswordChange($event)"
                (endIconClick)="onTogglePasswordVisibility()"
                (enterPress)="onSignIn()"
              ></th-input>
            </div>

            <div class="login-card__cta">
              <th-button expand="block" size="md" [disabled]="isLoading" (click)="onSignIn()">
                <span class="login-card__button-content">
                  <ion-spinner
                    *ngIf="isLoading"
                    name="crescent"
                    class="login-card__spinner"
                    [attr.aria-label]="'LOGIN.SUBMITTING_ARIA' | translate"
                  ></ion-spinner>
                  <span>{{ 'LOGIN.SUBMIT' | translate }}</span>
                </span>
              </th-button>
            </div>

            <ion-button fill="clear" size="small" class="login-card__link">
              {{ 'LOGIN.FORGOT_PASSWORD' | translate }}
            </ion-button>

            <p class="login-card__signup">
              {{ 'LOGIN.NO_ACCOUNT' | translate }}
              <ion-button fill="clear" class="login-card__link-inline" (click)="onGoToRegister()">
                {{ 'LOGIN.REGISTER_LINK' | translate }}
              </ion-button>
            </p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
