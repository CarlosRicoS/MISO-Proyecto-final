<ion-content class="home-content">
	<section class="home-hero">
		<div class="home-hero__inner">
			<h1 class="home-hero__title">{{ 'HOME.HERO_TITLE' | translate }}</h1>
			<p
				class="home-hero__subtitle"
				appPlatformText
				[appPlatformTextWeb]="heroSubtitleWeb"
				[appPlatformTextMobile]="heroSubtitleMobile"
			></p>
			<div class="home-hero__card">
				<th-filter
					class="home-filter"
					[locationLabel]="'HOME.DESTINATION_LABEL' | translate"
					[locationPlaceholder]="'HOME.DESTINATION_PLACEHOLDER' | translate"
					[locationValue]="searchCity"
					(locationValueChange)="onLocationChanged($event)"
					[checkInLabel]="'HOME.CHECKIN_LABEL' | translate"
					[checkInPlaceholder]="'HOME.CHECKIN_PLACEHOLDER' | translate"
					[checkInValue]="searchStartDate"
					(checkInClicked)="onCheckInClicked()"
					[checkOutLabel]="'HOME.CHECKOUT_LABEL' | translate"
					[checkOutPlaceholder]="'HOME.CHECKOUT_PLACEHOLDER' | translate"
					[checkOutValue]="searchEndDate"
					(checkOutClicked)="onCheckOutClicked()"
					[guestsLabel]="'HOME.GUESTS_LABEL' | translate"
					[guestsPlaceholder]="'HOME.GUESTS_PLACEHOLDER' | translate"
					[guestsValue]="guestsInputValue"
					(guestsValueChange)="onGuestsChanged($event)"
					[actionLabel]="'HOME.SEARCH_ACTION' | translate"
					[actionDisabled]="isSearchDisabled"
					(action)="onSearchHotels()"
				></th-filter>
			</div>

			<!-- Check-in Date Picker Modal -->
			<th-datetime-modal
				[isOpen]="showCheckInModal"
				[title]="'HOME.SELECT_CHECKIN_TITLE' | translate"
				[selectedDate]="tempDate"
				[minDate]="checkInMinDate"
				[confirmLabel]="'HOME.CONFIRM' | translate"
				[cancelLabel]="'HOME.CANCEL' | translate"
				(dateSelected)="onCheckInConfirmed($event)"
				(cancelled)="onCheckInCancelled()"
			></th-datetime-modal>

			<!-- Check-out Date Picker Modal with min date validation -->
			<th-datetime-modal
				[isOpen]="showCheckOutModal"
				[title]="'HOME.SELECT_CHECKOUT_TITLE' | translate"
				[selectedDate]="tempDate"
				[minDate]="convertDDMMYYYYToISO(searchStartDate) || checkInMinDate"
				[confirmLabel]="'HOME.CONFIRM' | translate"
				[cancelLabel]="'HOME.CANCEL' | translate"
				(dateSelected)="onCheckOutConfirmed($event)"
				(cancelled)="onCheckOutCancelled()"
			></th-datetime-modal>
		</div>
	</section>

	<section class="home-section">
		<div class="home-section__inner">
			<h2 class="home-section__title">{{ 'HOME.RECOMMENDED_TITLE' | translate }}</h2>
			<p class="home-section__subtitle">{{ 'HOME.RECOMMENDED_SUBTITLE' | translate }}</p>

			<div class="home-grid">
				<ng-container *ngIf="!isLoading && hotels.length">
					<th-hotel-card
						*ngFor="let hotel of hotels"
						class="home-card"
						variant="compact"
						[title]="hotel.name || 'Hotel'"
						[location]="getHotelLocation(hotel)"
						[price]="getHotelPrice(hotel)"
						[priceSuffix]="'HOME.PRICE_SUFFIX' | translate"
						[ctaLabel]="'HOME.BOOK_NOW' | translate"
						[rating]="getHotelRating(hotel)"
						[imageUrl]="hotel.photos[0] || ''"
						[ctaRouterLink]="['/propertydetail', hotel.id]"
					></th-hotel-card>
				</ng-container>
				<p class="home-empty" *ngIf="isLoading" aria-live="polite" aria-atomic="true">{{ 'HOME.LOADING' | translate }}</p>
				<p class="home-empty" *ngIf="!isLoading && errorMessage" role="alert" aria-live="assertive">{{ errorMessage }}</p>
				<p class="home-empty" *ngIf="!isLoading && !errorMessage && !hotels.length" aria-live="polite" aria-atomic="true">{{ 'HOME.EMPTY' | translate }}</p>
			</div>
		</div>
	</section>
</ion-content>
