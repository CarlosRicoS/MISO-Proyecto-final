<th-popup
  [isOpen]="isAlertOpen"
  [variant]="alertVariant"
  [title]="alertTitle"
  [message]="alertMessage"
  [primaryButtonText]="'PROPERTY.ACCEPT' | translate"
  (primaryAction)="onAlertDismissed()"
></th-popup>

<ion-content class="propertydetail-content">
  <section class="propertydetail-main" *ngIf="!isLoading && !errorMessage">
    <div class="propertydetail-main__inner">
      <div class="propertydetail-main__left">
        <section class="propertydetail-hero">
          <div class="propertydetail-hero__inner">
            <th-details-mosaic
              [hotelName]="property.title"
              [images]="property.images"
              [totalPhotos]="property.totalPhotos"
              [viewAllLabel]="'PROPERTY.VIEW_ALL_PHOTOS' | translate: { count: property.totalPhotos }"
            ></th-details-mosaic>
          </div>
        </section>

        <section class="propertydetail-summary">
          <div class="propertydetail-summary__inner">
            <th-detail-summary
              [title]="property.title"
              [location]="property.location"
              [score]="property.score"
              [scoreLabel]="property.scoreLabel"
              [reviewsText]="property.reviewsText"
              [stars]="property.stars"
            ></th-detail-summary>
          </div>
        </section>

        <section class="propertydetail-body">
          <div class="propertydetail-body__inner">
            <div class="propertydetail-body__details">
              <th-amenities-summary
                [amenities]="amenities"
                [totalAmenities]="amenities.length"
                [viewAllLabel]="'PROPERTY.AMENITIES' | translate"
              ></th-amenities-summary>

              <th-property-description-summary
                [title]="'PROPERTY.ABOUT' | translate"
                [paragraphs]="descriptionParagraphs"
                [readMoreLabel]="'PROPERTY.READ_MORE' | translate"
                [readLessLabel]="'PROPERTY.READ_LESS' | translate"
              ></th-property-description-summary>

              <th-property-review-summary
                [title]="'PROPERTY.REVIEWS' | translate"
                [desktopActionLabel]="'PROPERTY.WRITE_REVIEW' | translate"
                [mobileActionLabel]="'PROPERTY.SEE_ALL_REVIEWS' | translate"
                [loadMoreLabel]="'PROPERTY.LOAD_MORE_REVIEWS' | translate"
                [categoryScores]="reviewCategoryScores"
                [reviews]="guestReviews"
              ></th-property-review-summary>
            </div>
          </div>
        </section>
      </div>

      <aside class="propertydetail-main__right">
        <th-payment-summary
          [title]="paymentSummary.title"
          [subtitle]="'PROPERTY.PER_NIGHT' | translate"
          [promoText]="paymentSummary.promoText"
          [checkInLabel]="'PROPERTY.CHECKIN_LABEL' | translate"
          [checkInValue]="paymentSummary.checkInValue"
          [checkInError]="bookingErrors.checkIn"
          (checkInValueChange)="onCheckInChanged($event)"
          [checkOutLabel]="'PROPERTY.CHECKOUT_LABEL' | translate"
          [checkOutValue]="paymentSummary.checkOutValue"
          [checkOutError]="bookingErrors.checkOut"
          (checkOutValueChange)="onCheckOutChanged($event)"
          [guestsLabel]="'PROPERTY.GUESTS_LABEL' | translate"
          [guestsValue]="paymentSummary.guestsValue"
          [guestsError]="bookingErrors.guests"
          (guestsValueChange)="onGuestsChanged($event)"
          [roomTypeLabel]="'PROPERTY.ROOM_TYPE_LABEL' | translate"
          [roomTypeValue]="paymentSummary.roomTypeValue"
          [items]="summaryItems"
          [badges]="summaryBadges"
          [totalLabel]="'PROPERTY.TOTAL_LABEL' | translate"
          [totalAmount]="paymentSummary.totalAmount"
          [actionLabel]="'PROPERTY.BOOK_NOW' | translate"
          [actionDisabled]="isBooking || isPricingLoading || (priceForStay === null && !!paymentSummary.checkInValue && !!paymentSummary.checkOutValue)"
          [isLoading]="isBooking || isPricingLoading"
          (actionClick)="onBookNow()"
          [footnote]="pricingError || ('PROPERTY.FOOTNOTE_NO_CHARGE' | translate)"
          [trustLeftLabel]="'PROPERTY.TRUST_SECURE' | translate"
          [trustRightLabel]="'PROPERTY.TRUST_FREE_CANCELLATION' | translate"
          [mobileSticky]="true"
          [editorResetTrigger]="paymentSummaryResetVersion"
          [compactSuffix]="'PROPERTY.COMPACT_SUFFIX' | translate"
          [compactNote]="'PROPERTY.COMPACT_NOTE' | translate"
        ></th-payment-summary>
      </aside>
    </div>
  </section>
  <p class="propertydetail-empty" *ngIf="isLoading" aria-live="polite" aria-atomic="true">{{ 'PROPERTY.LOADING' | translate }}</p>
  <p class="propertydetail-empty" *ngIf="!isLoading && errorMessage" role="alert" aria-live="assertive">{{ errorMessage }}</p>
</ion-content>
