$kind: http-request
name: Check Availability
url: "{{base_url}}/check-in/api/check-in/available?property_id={{flow_property_id}}"
method: GET
headers:
  Authorization: Bearer {{id_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Returns 200', function () {
        pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test('is_available is boolean', function () {
        pm.expect(json.is_available).to.be.a('boolean');
      });
    language: text/javascript
order: 2000
